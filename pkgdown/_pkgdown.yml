url: https://dieghernan.github.io/rstudiothemes

figures:
  dpi: 300
  fig.retina: 2

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: G-JE054GNWFF
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

development:
  mode: auto

repo:
  branch: main

navbar:
  structure:
    right:
    - search
    - github
    - donate
    - lightswitch
  components:
    donate:
      icon: fa-hand-holding-dollar
      href: https://ko-fi.com/dieghernan
      aria-label: Support the project on Ko-fi

home:
  title: >
    rstudiothemes | Create and install custom RStudio themes from Visual
    Studio Code, Positron and TextMate themes
  description: >
    Convert Visual Studio Code, Positron and TextMate themes into custom
    RStudio themes.

reference:
- title: Create and convert themes
- subtitle: RStudio themes
  contents: convert_to_rstudio_theme
- subtitle: Visual Studio Code, Positron and TextMate conversion
  contents:
  - convert_vs_to_tm_theme
  - convert_tm_to_vs_theme

- title: Install, manage and preview themes
  desc: >
    Install, remove, list and preview the bundled RStudio themes. These
    functions are adapted from the **rsthemes** package.
  contents:
  - rstudiothemes-actions

- title: Other functions
- subtitle: Read themes
  contents: starts_with("read")
- subtitle: Utilities
  desc: >
    Helper functions available for reuse.
  contents: has_concept("helpers")

- title: About the package
  contents: rstudiothemes-package

authors:
  Diego Hernangómez:
    href: 'https://dieghernan.github.io/'

articles:
- title: Theme mapping
  desc: >
    See how theme elements map between Visual Studio Code, Positron, TextMate
    and RStudio formats.
  navbar: Theme mapping
  contents:
  - articles/mapping
- title: Theme gallery
  desc: >
    Preview the built-in RStudio themes.
  navbar: Theme gallery
  contents:
  - articles/showcase
- title: Online app
  desc: >
    Convert themes online with the Shiny app.
  navbar: Online app
  contents:
  - articles/shinyapp

redirects:
- ["articles/gallery.html", "articles/showcase.html"]
