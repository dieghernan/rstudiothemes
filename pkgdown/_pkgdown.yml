url: https://dieghernan.github.io/rstudiothemes

figures:
  dpi: 300
  fig.retina: 2

template:
  bootstrap: 5
  package: gitdevr
  params:
    ganalytics: G-JE054GNWFF
  opengraph:
    twitter:
      creator: "@dhernangomez"
      card: summary_large_image

development:
  mode: auto

repo:
  branch: main

navbar:
  structure:
    right:
    - search
    - github
    - donate
    - lightswitch
  components:
    donate:
      icon: fa-hand-holding-dollar
      href: https://ko-fi.com/dieghernan
      aria-label: Support the project on Ko-fi

home:
  title: >
    rstudiothemes | Create and Install Custom **RStudio** Themes
  description: >
    Create, convert and install custom **RStudio** editor themes from **Visual
    Studio Code**, **Positron** and **TextMate** theme files.

reference:
- title: Theme converters
  desc: >
    Convert theme files to **RStudio** `.rstheme` files or convert themes
    between **Visual Studio Code**, **Positron** and **TextMate** formats.

- contents:
  - has_concept("converters")

- title: Bundled themes
  desc: >
    Install, list, preview or remove bundled **RStudio** themes.

- contents:
  - rstudiothemes-actions

- title: Theme readers
  desc: >
    Read **Visual Studio Code**, **Positron** and **TextMate** theme files as
    tabular data for inspection or conversion workflows.

- contents:
  - has_concept("readers")

- title: Helpers
  desc: >
    Check the current IDE and generate theme identifiers.

- contents:
  - has_concept("helpers")

- title: Package overview
  desc: >
    Learn what the package does and where to start.

- contents:
  - rstudiothemes-package

authors:
  Diego Hernangómez:
    href: 'https://dieghernan.github.io/'

articles:
- title: Guides
  desc: >
    Learn the main workflows for installing, previewing and converting
    **RStudio** themes.
  contents:
  - rstudiothemes
- title: Explore themes
  desc: >
    Browse the bundled **RStudio** themes and inspect how theme elements map
    across supported formats.
  contents:
  - articles/showcase
  - articles/mapping
- title: Online converter
  desc: >
    Convert theme files in a browser with the hosted **Shiny** app.
  contents:
  - articles/shinyapp

redirects:
- ["articles/gallery.html", "articles/showcase.html"]
